apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 501579413510.dkr.ecr.us-east-1.amazonaws.com/dev-backend:backend-7-1
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: CORS_ORIGIN
              value: "*"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rds-credentials
                  key: database_url
