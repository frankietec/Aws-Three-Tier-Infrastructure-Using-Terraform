apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default  # REPLACE with your target namespace if different
  annotations:    
    cert-manager.io/cluster-issuer: "letsencrypt-prod"   
spec:
  tls:
  - hosts:
     - fkvr.xyz
     - api.fkvr.xyz
    secretName: app-tls-secret  # Cert-manager will automatically create and manage this secret
  rules:
  #frontend ingress rule
  - host: fkvr.xyz  
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend 
            port:
              number: 80  

  - host: api.fkvr.xyz  
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend 
            port:
              number: 3000  