
name: Deploy to AWS with Terraform

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-cicd.yaml"

  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run after review
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: Terraform Validation and Planning
  # ==========================================

  deploy-iac:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify AWS Account
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          if [ "$ACCOUNT_ID" != "501579413510" ]; then
            echo "ERROR: Unexpected AWS account: $ACCOUNT_ID"
            exit 1
          fi

          echo "Confirmed AWS account: $ACCOUNT_ID"

      - name: Configure EKS connection details
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="portal-app-dev-cluster"
          REGION="${{ secrets.AWS_REGION }}"

          echo "Checking EKS cluster..."

          CLUSTER_STATUS=$(aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$REGION" \
            --query "cluster.status" \
            --output text)

          if [ "$CLUSTER_STATUS" != "ACTIVE" ]; then
            echo "ERROR: EKS cluster status is $CLUSTER_STATUS"
            exit 1
          fi

          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$REGION"

          EKS_ENDPOINT=$(aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$REGION" \
            --query "cluster.endpoint" \
            --output text)

          EKS_CA=$(aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$REGION" \
            --query "cluster.certificateAuthority.data" \
            --output text)

          if [[ -z "$EKS_ENDPOINT" || "$EKS_ENDPOINT" == "None" ]]; then
            echo "ERROR: EKS endpoint was not retrieved."
            exit 1
          fi

          if [[ -z "$EKS_CA" || "$EKS_CA" == "None" ]]; then
            echo "ERROR: EKS certificate was not retrieved."
            exit 1
          fi

          {
            echo "TF_VAR_kubernetes_host=$EKS_ENDPOINT"
            echo "TF_VAR_kubernetes_cluster_ca_certificate=$EKS_CA"
          } >> "$GITHUB_ENV"

          echo "EKS connection details configured successfully."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install tfsec
        run: |
          curl -sLo tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64
          chmod +x tfsec
          ./tfsec --version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform Lint
        run: |
          tflint --init
          tflint --format compact

      - name: tfsec Scan
        run: ./tfsec .
        continue-on-error: true

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="deploy_kubernetes_resources=true" \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/tfplan
          retention-days: 1

  # ==========================================
  # JOB 2: Apply Infrastructure
  # ==========================================

  apply:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'apply' }}
    needs: deploy-iac
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify AWS Account
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          if [ "$ACCOUNT_ID" != "501579413510" ]; then
            echo "ERROR: Unexpected AWS account: $ACCOUNT_ID"
            exit 1
          fi

          echo "Confirmed AWS account: $ACCOUNT_ID"

      - name: Configure EKS connection details
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="portal-app-dev-cluster"
          REGION="${{ secrets.AWS_REGION }}"

          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$REGION"

          EKS_ENDPOINT=$(aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$REGION" \
            --query "cluster.endpoint" \
            --output text)

          EKS_CA=$(aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$REGION" \
            --query "cluster.certificateAuthority.data" \
            --output text)

          if [[ -z "$EKS_ENDPOINT" || "$EKS_ENDPOINT" == "None" ]]; then
            echo "ERROR: EKS endpoint was not retrieved."
            exit 1
          fi

          if [[ -z "$EKS_CA" || "$EKS_CA" == "None" ]]; then
            echo "ERROR: EKS certificate was not retrieved."
            exit 1
          fi

          {
            echo "TF_VAR_kubernetes_host=$EKS_ENDPOINT"
            echo "TF_VAR_kubernetes_cluster_ca_certificate=$EKS_CA"
          } >> "$GITHUB_ENV"

          echo "EKS connection details configured successfully."

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'

      - name: Verify kubectl installation
        run: kubectl version --client

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # ==========================================
  # JOB 3: Destroy Infrastructure
  # ==========================================

  destroy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' }}
    needs: deploy-iac
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify AWS Account
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          if [ "$ACCOUNT_ID" != "501579413510" ]; then
            echo "ERROR: Unexpected AWS account: $ACCOUNT_ID"
            exit 1
          fi

          echo "Confirmed AWS account: $ACCOUNT_ID"

      - name: Configure EKS connection details
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="portal-app-dev-cluster"
          REGION="${{ secrets.AWS_REGION }}"

          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$REGION"

          EKS_ENDPOINT=$(aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$REGION" \
            --query "cluster.endpoint" \
            --output text)

          EKS_CA=$(aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$REGION" \
            --query "cluster.certificateAuthority.data" \
            --output text)

          if [[ -z "$EKS_ENDPOINT" || "$EKS_ENDPOINT" == "None" ]]; then
            echo "ERROR: EKS endpoint was not retrieved."
            exit 1
          fi

          if [[ -z "$EKS_CA" || "$EKS_CA" == "None" ]]; then
            echo "ERROR: EKS certificate was not retrieved."
            exit 1
          fi

          {
            echo "TF_VAR_kubernetes_host=$EKS_ENDPOINT"
            echo "TF_VAR_kubernetes_cluster_ca_certificate=$EKS_CA"
          } >> "$GITHUB_ENV"

          echo "EKS connection details configured successfully."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -auto-approve \
            -var="deploy_kubernetes_resources=true"
