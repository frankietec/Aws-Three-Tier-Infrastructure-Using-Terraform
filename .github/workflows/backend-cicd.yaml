
name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: Choose whether to build/push or update the manifest
        required: true
        type: choice
        options:
          - build
          - update-manifest

permissions:
  contents: write

env:
  AWS_REGION: us-east-1
  MANIFEST_FILE: app-manifest/backend-deployment.yaml

jobs:
  build-and-push:
    if: github.event_name == 'push' || inputs.action == 'build'
    runs-on: ubuntu-latest

    # Disposable PostgreSQL database for automated tests only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_database_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d my_database_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Test-only environment variables. Never use production credentials here.
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME_TEST: my_database_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: test_jwt_secret
      SECRET_WORD: test_secret_word

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Resolve ECR repository
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)

          if [ "$account_id" != "501579413510" ]; then
            echo "Unexpected AWS account: $account_id"
            exit 1
          fi

          echo "ECR_REPOSITORY=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/dev-backend" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REPOSITORY"

      - name: Build and push backend image
        env:
          IMAGE_TAG: backend-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Create backend release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$IMAGE_TAG" \
            --title "$IMAGE_TAG" \
            --notes "Backend image: $ECR_REPOSITORY:$IMAGE_TAG" \
            --target "$GITHUB_SHA"

  update-manifest:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'update-manifest'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Resolve latest backend release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(gh release list --limit 100 --json tagName,publishedAt |
            jq -r '[.[] | select(.tagName | startswith("backend-"))] |
              sort_by(.publishedAt) | last | .tagName // empty')

          if [ -z "$release_tag" ]; then
            echo "No backend release found."
            exit 1
          fi

          account_id=$(aws sts get-caller-identity --query Account --output text)

          if [ "$account_id" != "501579413510" ]; then
            echo "Unexpected AWS account: $account_id"
            exit 1
          fi

          aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name dev-backend \
            --image-ids imageTag="$release_tag" >/dev/null

          echo "IMAGE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/dev-backend" >> "$GITHUB_ENV"

      - name: Update backend image tag
        run: |
          sed -i -E "s|^([[:space:]]*image: ).*|\\1${ECR_REPOSITORY}:${IMAGE_TAG}|" "$MANIFEST_FILE"

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          git add "$MANIFEST_FILE"

          git diff --cached --quiet ||
            git commit -m "Update backend image to ${IMAGE_TAG}"

          git push
