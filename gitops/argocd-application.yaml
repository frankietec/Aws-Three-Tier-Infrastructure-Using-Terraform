apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-management
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/frankietec/Aws-Three-Tier-Infrastructure-Using-Terraform.git
    targetRevision: main
    path: gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: {}
